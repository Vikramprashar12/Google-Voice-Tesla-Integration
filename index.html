<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Voice Tesla Integration</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<style>
  body {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  pre {
    background: #f5f5f5;
    padding: 12px;
    overflow-x: auto;
    border-radius: 6px;
  }
  code {
    background: #f5f5f5;
    padding: 2px 4px;
    border-radius: 4px;
  }
  img {
    max-width: 100%;
  }
</style>
</head>
<body>
<div id="content">Loading...</div>

<script>
  fetch('README.md')
    .then(res => res.text())
    .then(text => {
      document.getElementById('content').innerHTML = marked.parse(text);
    })
    .catch(err => {
      document.getElementById('content').innerText = 'Could not load README.md';
    });
</script>
</body>
</html>
